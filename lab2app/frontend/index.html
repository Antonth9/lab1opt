<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 2 - Docker Compose</title>
    <style>
        body { font-family: sans-serif; text-align: center; margin-top: 50px; background-color: #f4f4f9; }
        .container { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); display: inline-block; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; background-color: #007bff; color: white; border: none; border-radius: 4px; }
        button:hover { background-color: #0056b3; }
        #result { margin-top: 20px; font-size: 18px; font-weight: bold; color: #333; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Лабораторная работа №2</h1>
        <p>Нажмите кнопку, чтобы проверить связь с бэкендом:</p>
        <button onclick="fetchData()">Проверить бэкенд</button>
        <div id="result">Ожидание...</div>
    </div>

    <script>
        async function fetchData() {
            const resultDiv = document.getElementById('result');
            resultDiv.textContent = 'Загрузка...';
            try {
                // Запрос идет на /api/hello, Nginx перенаправит его на бэкенд
                const response = await fetch('/api/hello');
                if (!response.ok) throw new Error('Ошибка сети');
                const data = await response.json();
                resultDiv.textContent = data.message;
                resultDiv.style.color = 'green';
            } catch (error) {
                resultDiv.textContent = 'Ошибка подключения к бэкенду: ' + error.message;
                resultDiv.style.color = 'red';
            }
        }
    </script>
</body>
</html>
